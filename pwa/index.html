<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gudang Elektrik</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#0F172A">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gudang Elektrik">
    <meta name="application-name" content="Gudang Elektrik">
    <meta name="msapplication-TileColor" content="#0F172A">
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0F172A;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #FFFFFF;
        }
        #pwa-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #0F172A;
        }
        #splash {
            position: fixed;
            inset: 0;
            background: #0F172A;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        #splash.hidden {
            opacity: 0;
            visibility: hidden;
        }
        .splash-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 1.25rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            animation: pulse 1.8s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .splash-title {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            margin-bottom: 0.35rem;
        }
        .splash-sub {
            font-size: 0.8rem;
            color: #94A3B8;
            margin-bottom: 2rem;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255,255,255,0.15);
            border-top-color: #38BDF8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #offline-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #EF4444;
            color: white;
            text-align: center;
            padding: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            z-index: 1000;
            display: none;
        }
    </style>
</head>
<body>

    <div id="offline-banner">Koneksi Internet Terputus — Memeriksa Jaringan...</div>

    <div id="splash">
        <img src="icons/icon-192.png" alt="Gudang Elektrik" class="splash-icon">
        <div class="splash-title">Gudang Elektrik</div>
        <div class="splash-sub">Inventory Management System</div>
        <div class="spinner"></div>
    </div>

    <iframe id="pwa-frame" src="https://script.google.com/macros/s/AKfycbzMZQ1Qngh1r4ddx-adIPl1-UTiIgrb219ErnyYlXQiVVuL8mSoV5HVez7BgXosFpuG/exec" allow="camera; clipboard-read; clipboard-write;" onload="onFrameLoaded()"></iframe>

    <script>
        function onFrameLoaded() {
            const splash = document.getElementById('splash');
            if (splash) {
                setTimeout(() => splash.classList.add('hidden'), 500);
            }
        }

        // Offline detection
        window.addEventListener('online', () => {
            document.getElementById('offline-banner').style.display = 'none';
        });
        window.addEventListener('offline', () => {
            document.getElementById('offline-banner').style.display = 'block';
        });

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW Registered:', reg.scope))
                    .catch(err => console.log('SW Failed:', err));
            });
        }
    </script>
</body>
</html>
